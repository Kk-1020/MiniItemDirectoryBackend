spring.application.name=mini-item-directory

# In-memory H2 database. Data resets on every restart, which is fine for a prototype.
spring.datasource.url=jdbc:h2:mem:itemdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Server port. Hosting platforms (e.g. Render) inject PORT; we honor it.
server.port=${PORT:8080}

# Comma-separated list of frontend origins allowed to call the API.
# Defaults to "*" (any origin) — fine for this prototype since there is no auth.
# In a real app you would restrict this, e.g. ALLOWED_ORIGINS=https://your-frontend.netlify.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:*}
